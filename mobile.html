<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：让页面延伸到 iPhone 刘海/圆角区，配合下面的 safe-area 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/huluob0721/huluob0721.github.io/main/zozlogo.png">
  <title>胡萝卜的个人博客</title>

  <!-- 设备分流：万一是电脑打开了这个页面，自动送回 PC 版 -->
  <script src="device-redirect.js"></script>

  <style>
    /* ---------- 基础 ---------- */
    :root {
      --glass-bg:       rgba(255, 255, 255, 0.26);
      --glass-bg-hover: rgba(255, 255, 255, 0.38);
      --glass-border:   rgba(255, 255, 255, 0.85);
      --tabbar-h:       62px;
      --safe-b:         env(safe-area-inset-bottom, 0px);
      --safe-t:         env(safe-area-inset-top, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 移动端要的是"系统光标"和原生滚动手感，不要 PC 那套自定义箭头 */
    html, body {
      height: 100%;
      overflow: hidden;                 /* 整页不滚，只让内容区滚 */
      overscroll-behavior: none;        /* 关掉系统的下拉刷新/橡皮筋，换成自己的 */
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #0d1117;
      color: #0f172a;
      /* iOS 优先：SF Pro / PingFang SC，数字按系统风格渲染 */
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC',
                   'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;
      font-feature-settings: 'kern' 1;
      text-rendering: optimizeLegibility;
      /* 禁止长按选中/弹菜单，避免误触；输入框单独放开 */
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- 壁纸层 ---------- */
    #wallpaper {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: cover; background-position: center;
      transition: opacity 0.45s ease;
    }
    #wallpaper.switching { opacity: 0.35; }

    /* ---------- 整体骨架：内容区 + 底栏 ---------- */
    .app {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      /* iOS 状态栏 / 灵动岛下方留一点呼吸空间 */
      padding-top: calc(var(--safe-t) + 8px);
    }
    @supports not (height: 100dvh) {
      .app { height: 100vh; }
    }

    /* ---------- 内容区（唯一可滚动的地方） ---------- */
    .viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      /* 底栏是浮动胶囊，留白要把它整块让出来（含安全区） */
      padding: 0 16px calc(var(--tabbar-h) + var(--safe-b) + 34px);
    }
    /* 原生滚动条在移动端本来就很细，直接隐藏更干净 */
    .viewport::-webkit-scrollbar { display: none; }
    .viewport { scrollbar-width: none; }

    /* ---------- 玻璃卡片 ---------- */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--glass-border);
      /* iOS 的连续圆角观感，配合顶部一道内侧高光 */
      border-radius: 26px;
      padding: 26px 20px;
      margin-top: 14px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.14),
                  0 0 0 0.5px rgba(255,255,255,0.55) inset,
                  0 1px 0 rgba(255,255,255,0.75) inset;
    }

    /* ---------- 主页 ---------- */
    .avatar-wrap { text-align: center; }
    .avatar {
      width: 92px; height: 92px; border-radius: 50%;
      object-fit: cover; border: 3px solid rgba(255,255,255,0.85);
      box-shadow: 0 4px 14px rgba(79,70,229,0.28);
    }
    .avatar-fallback {
      width: 92px; height: 92px; border-radius: 50%; margin: 0 auto;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: 3px solid rgba(255,255,255,0.85);
    }
    .nickname {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 27px; color: #0f172a; margin: 14px 0 4px; letter-spacing: 1px;
    }
    .subtitle { font-size: 14.5px; color: #475569; margin-bottom: 18px; font-weight: 500; }
    .bio { font-size: 14.5px; color: #334155; line-height: 1.9; text-align: left; }
    .bio p { margin-bottom: 8px; }
    .bio p:last-child { margin-bottom: 0; }

    /* ---------- 区块标题 ---------- */
    .section-title {
      font-size: 17px; font-weight: 700; color: #3730a3;
      margin-bottom: 14px; padding-left: 11px;
      border-left: 4px solid #667eea;
      text-align: left;
    }

    /* ---------- 列表条目（番剧 / 游戏 / 动态 共用） ---------- */
    .list { display: flex; flex-direction: column; gap: 11px; }
    .item {
      display: flex; align-items: flex-start; gap: 13px;
      padding: 13px 14px; border-radius: 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      text-align: left;
      transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1),
                  background 0.2s ease;
    }
    /* iOS 的按压反馈：轻微缩小 + 回弹 */
    .item:active { background: var(--glass-bg-hover); transform: scale(0.97); }
    .item-cover {
      flex-shrink: 0; width: 52px; height: 72px; border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      object-fit: cover;
    }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-size: 15.5px; color: #0f172a; font-weight: 600; line-height: 1.45; }
    .item-meta  { font-size: 12.5px; color: #475569; margin-top: 4px; font-weight: 500; }
    .item-score { color: #f59e0b; font-weight: 700; letter-spacing: 1px; }
    .item-comment { font-size: 13.5px; color: #334155; line-height: 1.7; margin-top: 5px; }
    .item-status {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 7px; margin-left: 6px;
      background: rgba(102,126,234,0.16); color: #4338ca;
    }
    .item-status.playing { background: rgba(236,72,153,0.16); color: #be185d; }
    .item-status.dropped { background: rgba(100,116,139,0.18); color: #475569; }

    .news-tag {
      display: inline-block; font-size: 11px; color: #ec4899;
      background: rgba(236,72,153,0.14);
      padding: 2px 8px; border-radius: 7px; margin-top: 5px; font-weight: 600;
    }
    .news-date {
      flex-shrink: 0; font-size: 12px; color: #667eea; font-weight: 700;
      background: rgba(102,126,234,0.14);
      padding: 5px 10px; border-radius: 9px; white-space: nowrap;
    }
    .empty { font-size: 14px; color: #64748b; text-align: center; padding: 26px 0; }

    /* ---------- 留言板 ---------- */
    .giscus-host { min-height: 260px; border-radius: 14px; overflow: hidden; }
    .giscus-host iframe { width: 100%; border: none; min-height: 420px; }
    .board-hint {
      font-size: 12.5px; color: #64748b; line-height: 1.8;
      text-align: center; padding: 8px 4px 14px;
    }
    .board-hint a { color: #4f46e5; text-decoration: none; -webkit-user-select: all; user-select: all; }

    /* ---------- 底部标签栏 ----------
       和 PC 版顶部导航是同一套视觉语言：浮动玻璃胶囊 + 紫蓝渐变滑块指示器，
       只是挪到底部、改成图标在上文字在下，以契合 iOS 的操作习惯。 */
    .tabbar {
      position: fixed; z-index: 50;
      left: 12px; right: 12px;
      bottom: calc(10px + var(--safe-b));
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18),
                  0 0 0 0.5px rgba(255,255,255,0.6) inset;
    }
    .tabbar-inner { position: relative; display: flex; align-items: center; gap: 2px; }

    /* 滑块：与 PC 版 .nav-indicator 完全同款 */
    .tab-indicator {
      position: absolute; top: 0; left: 0;
      height: 100%; width: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(102,126,234,0.88), rgba(118,75,162,0.88));
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
      transition: transform 0.42s cubic-bezier(0.34, 1.4, 0.64, 1),
                  width 0.42s cubic-bezier(0.34, 1.4, 0.64, 1);
      z-index: 0;
    }
    .tab {
      position: relative; z-index: 1;
      flex: 1; border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 7px 2px;
      border-radius: 999px;
      font-family: inherit; font-size: 11px; font-weight: 600;
      color: #312e81; letter-spacing: 0.2px;
      transition: color 0.28s ease, transform 0.2s ease;
      min-height: 48px;                 /* iOS 建议的触摸目标尺寸 */
    }
    .tab .ico { font-size: 18px; line-height: 1; }
    .tab.active { color: #fff; }
    .tab:active { transform: scale(0.94); }

    /* ---------- 下拉换壁纸 ---------- */
    .pull-hint {
      position: absolute; left: 0; right: 0; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      height: 0; overflow: hidden;
      font-size: 13px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 6px rgba(15,23,42,0.5);
      transition: height 0.25s ease;
      pointer-events: none;
    }
    .pull-hint.ready { color: #fff; }

    /* ---------- 动态详情：底部抽屉（比居中弹窗更适合手机） ---------- */
    .sheet-mask {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(15,23,42,0.42);
      opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
    }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 91;
      max-height: 82dvh;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 34px 34px 0 0;
      border-top: 1px solid rgba(255,255,255,0.9);
      padding: 10px 22px calc(26px + var(--safe-b));
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column;
    }
    .sheet.show { transform: translateY(0); }
    .sheet-grab {
      width: 38px; height: 5px; border-radius: 3px;
      background: rgba(15,23,42,0.20); margin: 0 auto 14px; flex-shrink: 0;
      cursor: pointer;
    }
    .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sheet-date {
      display: inline-block; font-size: 12.5px; font-weight: 700;
      color: #667eea; background: rgba(102,126,234,0.14);
      padding: 5px 11px; border-radius: 9px; margin-bottom: 12px;
    }
    .sheet-title {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 23px; color: #0f172a; margin-bottom: 14px; line-height: 1.4;
    }
    .sheet-text { font-size: 15.5px; color: #334155; line-height: 1.95; margin-bottom: 13px; }
    .sheet-text:last-child { margin-bottom: 0; }

    /* ---------- 点击爱心 ---------- */
    .heart {
      position: fixed; z-index: 80; pointer-events: none;
      font-size: 20px;
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      100% { opacity: 0; transform: translate(-50%, -170%) scale(1.35); }
    }

    /* ---------- 切页动效 ---------- */
    .page { display: none; }
    .page.active { display: block; animation: pageIn 0.26s ease; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 首次入场 ---------- */
    #boot {
      position: fixed; inset: 0; z-index: 200;
      background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .dot {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.18);
      border-top-color: #a5b4fc;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 横屏 / 大屏手机稍微收一收 */
    @media (min-width: 600px) {
      .viewport { max-width: 560px; margin: 0 auto; width: 100%; }
    }
  </style>
</head>
<body>

  <div id="wallpaper"></div>

  <div class="app">
    <div class="pull-hint" id="pullHint">下拉可以换壁纸</div>

    <div class="viewport" id="viewport">

      <!-- 主页 -->
      <section class="page active" data-page="home">
        <div class="card">
          <div class="avatar-wrap">
            <img class="avatar" id="avatar" alt="头像">
            <div class="avatar-fallback" id="avatarFallback"></div>
          </div>
          <h2 class="nickname">胡萝卜</h2>
          <p class="subtitle">高一学生 · 编程 / 看番 / 打游戏</p>
          <div class="bio" id="bio"></div>
        </div>
      </section>

      <!-- 看过的番 -->
      <section class="page" data-page="anime">
        <div class="card">
          <div class="section-title">看过的番</div>
          <div class="list" id="animeList"></div>
        </div>
      </section>

      <!-- 玩过的游戏 -->
      <section class="page" data-page="game">
        <div class="card">
          <div class="section-title">玩过的游戏</div>
          <div class="list" id="gameList"></div>
        </div>
      </section>

      <!-- 留言板 -->
      <section class="page" data-page="board">
        <div class="card">
          <div class="section-title">留言板</div>
          <div class="board-hint" id="boardHint">留言由 GitHub 提供，登录后即可发言</div>
          <div class="giscus-host" id="giscusHost"></div>
        </div>
      </section>

      <!-- 最新动态 -->
      <section class="page" data-page="news">
        <div class="card">
          <div class="section-title">最新动态</div>
          <div class="list" id="newsList"></div>
        </div>
      </section>

    </div>
  </div>

  <!-- 底部标签栏 -->
  <nav class="tabbar" id="tabbar">
    <div class="tabbar-inner">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab active" data-page="home"><span class="ico">🏠</span><span>主页</span></button>
      <button class="tab" data-page="anime"><span class="ico">📺</span><span>番剧</span></button>
      <button class="tab" data-page="game"><span class="ico">🎮</span><span>游戏</span></button>
      <button class="tab" data-page="board"><span class="ico">💬</span><span>留言</span></button>
      <button class="tab" data-page="news"><span class="ico">✨</span><span>动态</span></button>
    </div>
  </nav>

  <!-- 动态详情抽屉 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-body">
      <span class="sheet-date" id="sheetDate"></span>
      <h3 class="sheet-title" id="sheetTitle"></h3>
      <div id="sheetText"></div>
    </div>
  </div>

  <div id="boot"><div class="dot"></div></div>

  <script src="data.js"></script>
  <script>
  (function () {
    'use strict';

    /* ================= 数据 ================= */
    var D = window.SITE_DATA || {};
    var DYNAMICS = D.DYNAMICS || [];
    var ANIME    = D.ANIME    || [];
    var GAMES    = D.GAMES    || [];
    var GISCUS   = D.GISCUS   || {};
    var WALLPAPERS   = D.PROFILE_WALLPAPERS || [];
    var AVATAR_URL   = D.AVATAR_URL || '';
    var PRELOAD_TIMEOUT = D.PRELOAD_TIMEOUT || 3000;
    var DISCUSS_URL = D.DISCUSS_URL || '';

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function starStr(n) {
      n = Number(n) || 0;
      return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
    }
    function statusCls(s) {
      if (s === '在玩' || s === '在看' || s === '偶尔玩') return 'playing';
      if (s === '弃坑' || s === '弃番') return 'dropped';
      return '';
    }

    /* ================= 壁纸 ================= */
    var wallpaper = document.getElementById('wallpaper');
    var wallIdx = 0;
    var wallLoaded = [];

    function applyWallpaper(i) {
      var url = WALLPAPERS[i];
      if (!url) return;
      wallpaper.classList.add('switching');
      var img = new Image();
      var done = false;
      var finish = function () {
        if (done) return; done = true;
        wallpaper.style.backgroundImage = 'url("' + url + '")';
        wallpaper.classList.remove('switching');
      };
      img.onload = finish; img.onerror = finish;
      img.src = url;
      setTimeout(finish, PRELOAD_TIMEOUT);
    }
    function nextWallpaper() {
      if (WALLPAPERS.length < 2) return;
      wallIdx = (wallIdx + 1) % WALLPAPERS.length;
      applyWallpaper(wallIdx);
    }
    // 启动：先预载第一张，最多等 PRELOAD_TIMEOUT
    (function bootWallpaper() {
      if (!WALLPAPERS.length) return;
      applyWallpaper(0);
      WALLPAPERS.forEach(function (u) { var i = new Image(); i.src = u; });
    })();

    /* ================= 头像 ================= */
    (function bootAvatar() {
      if (!AVATAR_URL) { document.getElementById('avatar').style.display = 'none'; return; }
      var img = document.getElementById('avatar');
      var fb = document.getElementById('avatarFallback');
      fb.style.display = 'none';
      img.onload = function () { img.style.display = 'block'; fb.style.display = 'none'; };
      img.onerror = function () { img.style.display = 'none'; fb.style.display = 'block'; };
      var t = setTimeout(function () {
        if (!img.complete) { img.style.display = 'none'; fb.style.display = 'block'; }
      }, PRELOAD_TIMEOUT);
      img.onload = function () { clearTimeout(t); img.style.display = 'block'; fb.style.display = 'none'; };
      img.src = AVATAR_URL;
    })();

    /* ================= 渲染 ================= */
    var BIO_LINES = [
      '你好！我是胡萝卜，目前是上海市第二中学的一名高一学生',
      '兴趣爱好有：编程，看番，运动，打游戏',
      '最近迷上了Galgame，如果你有喜欢的，欢迎联系我',
      '联系方式：hhzweiyu6b35@outlook.com'
    ];
    document.getElementById('bio').innerHTML =
      BIO_LINES.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('');

    function renderEntries(mount, items, metaFn) {
      if (!mount) return;
      if (!items.length) { mount.innerHTML = '<div class="empty">这里还没有内容</div>'; return; }
      mount.innerHTML = items.map(function (it) {
        var cover = it.cover
          ? '<img class="item-cover" src="' + esc(it.cover) + '" alt="">'
          : '<div class="item-cover" style="background:linear-gradient(135deg,' +
            esc(it.color || '#667eea') + ',#764ba2)"></div>';
        return '' +
          '<div class="item">' + cover +
            '<div class="item-main">' +
              '<div class="item-title">' + esc(it.title) +
                (it.status ? '<span class="item-status ' + statusCls(it.status) + '">' + esc(it.status) + '</span>' : '') +
              '</div>' +
              '<div class="item-meta">' + esc(metaFn(it)) + ' · <span class="item-score">' + starStr(it.score) + '</span></div>' +
              (it.comment ? '<div class="item-comment">' + esc(it.comment) + '</div>' : '') +
            '</div>' +
          '</div>';
      }).join('');
    }
    renderEntries(document.getElementById('animeList'), ANIME, function (a) { return a.year || ''; });
    renderEntries(document.getElementById('gameList'), GAMES, function (g) {
      return (g.platform ? g.platform + ' · ' : '') + (g.hours ? g.hours + 'h' : '');
    });

    (function renderNews() {
      var mount = document.getElementById('newsList');
      if (!DYNAMICS.length) { mount.innerHTML = '<div class="empty">暂无动态</div>'; return; }
      mount.innerHTML = DYNAMICS.map(function (n, i) {
        return '' +
          '<div class="item" data-idx="' + i + '">' +
            '<span class="news-date">' + esc(n.date) + '</span>' +
            '<div class="item-main">' +
              '<div class="item-title">' + esc(n.text) + '</div>' +
              (n.tag ? '<span class="news-tag">' + esc(n.tag) + '</span>' : '') +
            '</div>' +
          '</div>';
      }).join('');
      // 事件委托：点条目打开抽屉
      mount.addEventListener('click', function (e) {
        var el = e.target.closest ? e.target.closest('.item') : null;
        if (!el) return;
        openSheet(Number(el.dataset.idx));
      });
    })();

    /* ================= 底部抽屉 ================= */
    var sheet = document.getElementById('sheet');
    var mask = document.getElementById('sheetMask');
    function openSheet(i) {
      var n = DYNAMICS[i];
      if (!n) return;
      document.getElementById('sheetDate').textContent = n.date || '';
      document.getElementById('sheetTitle').textContent = n.text || '';
      var lines = Array.isArray(n.detail) ? n.detail : [n.detail || ''];
      document.getElementById('sheetText').innerHTML =
        lines.map(function (t) { return '<p class="sheet-text">' + esc(t) + '</p>'; }).join('');
      mask.classList.add('show');
      sheet.classList.add('show');
    }
    function closeSheet() {
      mask.classList.remove('show');
      sheet.classList.remove('show');
    }
    mask.addEventListener('click', closeSheet);
    // 抽屉顶部那条小横杠也能下滑关闭
    (function sheetSwipe() {
      var y0 = null;
      var grab = sheet.querySelector('.sheet-grab');
      sheet.addEventListener('touchstart', function (e) {
        y0 = e.touches[0].clientY;
      }, { passive: true });
      sheet.addEventListener('touchmove', function (e) {
        if (y0 == null) return;
        var dy = e.touches[0].clientY - y0;
        if (dy > 0 && (sheet.scrollTop || 0) <= 0) {
          sheet.style.transform = 'translateY(' + dy + 'px)';
          sheet.style.transition = 'none';
        }
      }, { passive: true });
      sheet.addEventListener('touchend', function (e) {
        if (y0 == null) return;
        var dy = (e.changedTouches[0].clientY || 0) - y0;
        sheet.style.transition = '';
        sheet.style.transform = '';
        if (dy > 90) closeSheet();
        y0 = null;
      });
      if (grab) grab.addEventListener('click', closeSheet);
    })();

    /* ================= 栏目切换 ================= */
    var PAGES = ['home', 'anime', 'game', 'board', 'news'];
    var current = 'home';
    var viewport = document.getElementById('viewport');

    /* 滑块指示器：和 PC 版顶部导航同款，跟着当前栏目滑动 */
    var indicator = document.getElementById('tabIndicator');
    function moveIndicator(name) {
      var t = document.querySelector('.tab[data-page="' + name + '"]');
      if (!t || !indicator) return;
      indicator.style.width = t.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + t.offsetLeft + 'px)';
    }

    function goTo(name) {
      if (PAGES.indexOf(name) < 0) return;
      if (name === current) { moveIndicator(name); return; }
      current = name;
      document.querySelectorAll('.page').forEach(function (p) {
        p.classList.toggle('active', p.dataset.page === name);
      });
      document.querySelectorAll('.tab').forEach(function (t) {
        t.classList.toggle('active', t.dataset.page === name);
      });
      moveIndicator(name);
      viewport.scrollTop = 0;
      if (name === 'board') mountGiscus();
    }
    // 首次定位 + 屏幕旋转/尺寸变化后重新对位
    function syncIndicator() { moveIndicator(current); }
    syncIndicator();
    window.addEventListener('resize', syncIndicator);
    window.addEventListener('orientationchange', function () {
      setTimeout(syncIndicator, 250);
    });
    document.getElementById('tabbar').addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.tab') : null;
      if (t) goTo(t.dataset.page);
    });

    /* ================= 左右滑动切栏目 ================= */
    (function swipe() {
      var x0 = null, y0 = null, moved = false;
      viewport.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { x0 = null; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
      }, { passive: true });
      viewport.addEventListener('touchmove', function (e) {
        if (x0 == null) return;
        var dx = e.touches[0].clientX - x0;
        var dy = e.touches[0].clientY - y0;
        // 已经判定为纵向滚动就不再处理
        if (Math.abs(dy) > Math.abs(dx)) { x0 = null; return; }
        if (Math.abs(dx) > 12) moved = true;
      }, { passive: true });
      viewport.addEventListener('touchend', function (e) {
        if (x0 == null) { return; }
        var dx = (e.changedTouches[0].clientX || 0) - x0;
        var dy = (e.changedTouches[0].clientY || 0) - y0;
        if (moved && Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.6) {
          var i = PAGES.indexOf(current);
          var next = PAGES[Math.max(0, Math.min(PAGES.length - 1, i + (dx < 0 ? 1 : -1)))];
          if (next !== current) goTo(next);
        }
        x0 = null;
      });
    })();

    /* ================= 下拉换壁纸 ================= */
    (function pullToRefresh() {
      var hint = document.getElementById('pullHint');
      var startY = null, pulling = false;
      var THRESHOLD = 78;

      viewport.addEventListener('touchstart', function (e) {
        if (viewport.scrollTop <= 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY; pulling = false;
        } else { startY = null; }
      }, { passive: true });

      viewport.addEventListener('touchmove', function (e) {
        if (startY == null) return;
        var dy = e.touches[0].clientY - startY;
        if (dy <= 0) { hint.style.height = '0px'; return; }
        if (viewport.scrollTop > 0) { startY = null; hint.style.height = '0px'; return; }
        pulling = true;
        var h = Math.min(64, dy * 0.5);
        hint.style.height = h + 'px';
        hint.textContent = dy > THRESHOLD ? '松开换一张壁纸 ✨' : '下拉可以换壁纸';
      }, { passive: true });

      viewport.addEventListener('touchend', function (e) {
        if (startY == null) return;
        var dy = (e.changedTouches[0].clientY || 0) - startY;
        if (pulling && dy > THRESHOLD) nextWallpaper();
        hint.style.height = '0px';
        startY = null; pulling = false;
      });
    })();

    /* ================= 点击冒爱心 ================= */
    var HEARTS = ['❤️', '💙', '💜', '🧡', '💖', '✨'];
    document.addEventListener('click', function (e) {
      // 底栏、抽屉、链接不冒，避免干扰操作
      if (e.target.closest && e.target.closest('.tabbar, .sheet, .sheet-mask, a')) return;
      var h = document.createElement('div');
      h.className = 'heart';
      h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      h.style.left = e.clientX + 'px';
      h.style.top = e.clientY + 'px';
      document.body.appendChild(h);
      setTimeout(function () { h.remove(); }, 900);
    });

    /* ================= Giscus 留言板 ================= */
    var giscusMounted = false;
    function mountGiscus() {
      if (giscusMounted) return;
      if (!GISCUS.repo || !GISCUS.repoId) return;
      // 本地预览（file:// 等）加载不了，给个直链就好
      if (!/^https?:$/.test(location.protocol)) {
        document.getElementById('boardHint').innerHTML =
          '预览环境加载不了留言板，<a href="' + esc(DISCUSS_URL || '#') + '" target="_blank" rel="noopener">去 GitHub 看</a>';
        return;
      }
      giscusMounted = true;
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      var attrs = {
        'data-repo': GISCUS.repo,
        'data-repo-id': GISCUS.repoId,
        'data-category': GISCUS.category,
        'data-category-id': GISCUS.categoryId,
        'data-mapping': GISCUS.mapping || 'number',
        'data-term': GISCUS.term || '1',
        'data-strict': '0',
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'top',
        'data-theme': GISCUS.theme || 'light',
        'data-lang': 'zh-CN'
      };
      Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
      document.getElementById('giscusHost').appendChild(s);
    }

    /* ================= 启动 ================= */
    var booted = false;
    function boot() {
      if (booted) return;
      booted = true;
      var b = document.getElementById('boot');
      if (b) {
        b.classList.add('gone');
        setTimeout(function () { b.remove(); }, 450);
      }
      // 支持 #anime / #board 这类直达
      var h = (location.hash || '').replace('#', '');
      if (PAGES.indexOf(h) >= 0) goTo(h);
    }
    setTimeout(boot, 400);
    // 兜底：壁纸再慢也不能卡住启动
    setTimeout(boot, PRELOAD_TIMEOUT);
  })();
  </script>
</body>
</html>
